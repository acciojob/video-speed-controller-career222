<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Scrubber</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

 <div class="player">
        <video class="viewer" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>

        <div class="controls">
            <div class="progress">
                <div class="progress__filled"></div>
            </div>

            <button class="player__button toggle">►</button>

            <input type="range" name="volume" class="volume"
                   min="0" max="1" step="0.01" value="1">

            <input type="range" name="playbackSpeed" class="playbackSpeed"
                   min="0.5" max="2" step="0.1" value="1">

            <button data-skip="-10" class="skip">« 10s</button>
            <button data-skip="25" class="skip">25s »</button>
        </div>
    </div>

<script  src="./script.js">
  //Your code goes here
</script>
</body>
</html>
